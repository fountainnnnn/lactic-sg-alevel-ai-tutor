name: jcai
description: JCAI — A-Level study tutor for Singapore JC students.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.6.0
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/icon/
