name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # type-check every function entrypoint (catches the kind of break a deploy
      # would otherwise surface in production)
      - name: deno check
        run: deno check supabase/functions/*/index.ts
      - name: deno test
        # --allow-env: dailyTokenCap() in _shared/db.ts reads optional
        # *_TOKENS_PER_DAY overrides via Deno.env.get (falls back to defaults).
        run: deno test --allow-env supabase/functions/tests/

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # errors + warnings fail the build; style infos (e.g. lint deprecations)
      # don't, so a non-actionable hint can't block a green pipeline.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
